<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lời mời dành cho Quỳnh 💌</title>
<style>
:root{--bg1:#ffe3ec;--bg2:#ffd1dc;--card:#ffffff;--text:#4a2335;--muted:#8a5a6e;--pink:#ff5c8a;--pink2:#ff8fab;--soft:#fff0f4;--line:#ffc2d4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1420;--bg2:#3a1a2b;--card:#3d2030;--text:#ffe8ef;--muted:#e3b3c5;--pink:#ff6f99;--pink2:#ff8fab;--soft:#4b2639;--line:#6b3650;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#2a1420;--bg2:#3a1a2b;--card:#3d2030;--text:#ffe8ef;--muted:#e3b3c5;--pink:#ff6f99;--pink2:#ff8fab;--soft:#4b2639;--line:#6b3650;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2));background-color:var(--bg1);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:16px;overflow-x:hidden}
.card{background:var(--card);width:100%;max-width:520px;border-radius:28px;padding:clamp(22px,5vw,40px);box-shadow:0 12px 40px rgba(255,92,138,.25);text-align:center;position:relative;z-index:2}
.emoji{font-size:clamp(44px,12vw,64px);line-height:1;margin-bottom:8px}
h1{font-size:clamp(21px,5.2vw,28px);line-height:1.35;margin:8px 0 22px}
.sub{color:var(--muted);margin:-10px 0 20px;font-size:15px}
.step{display:none;animation:in .4s ease}
.step.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.col{display:grid;gap:10px}
button{font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--line);background:var(--soft);color:var(--text);border-radius:16px;padding:14px 18px;font-size:16px;transition:transform .15s,background .15s,border-color .15s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:hover{border-color:var(--pink);transform:translateY(-2px)}
button:active{transform:scale(.97)}
button.yes{background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;border-color:transparent;font-size:18px;padding:14px 30px}
button.no{background:var(--soft)}
#no.fly{position:fixed;z-index:9999;margin:0;transition:opacity .22s ease}
#no.gone{opacity:0;pointer-events:none}
.result{font-size:clamp(16px,4.3vw,19px);line-height:1.7}
.result b{color:var(--pink)}
.hearts{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.hearts span{position:absolute;bottom:-40px;opacity:.5;animation:up linear infinite}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
.mus{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:10000;width:44px;height:44px;border-radius:50%;padding:0;font-size:20px;background:var(--card);box-shadow:0 4px 14px rgba(255,92,138,.3)}
@media (prefers-reduced-motion:reduce){.hearts{display:none}.step{animation:none}}
</style>
</head>
<body>
<div class="hearts" id="hearts" aria-hidden="true"></div>
<button type="button" class="mus" id="mus" aria-label="Bật hoặc tắt nhạc nền" title="Nhạc nền">🎵</button>
<main class="card">
  <section class="step on" id="s1">
    <div class="emoji">💌</div>
    <h1>Quỳnh sẽ đi ăn với Bèn khi Bèn trở về nhé?</h1>
    <div class="row" id="btns">
      <button class="yes" id="yes">ukiii</button>
      <button class="no" id="no">không thèmmm</button>
    </div>
  </section>
  <section class="step" id="s2">
    <div class="emoji">📅</div>
    <h1>Quỳnh muốn đi ngày nào nè?</h1>
    <div class="grid" id="dates"></div>
  </section>
  <section class="step" id="s3">
    <div class="emoji">🕡</div>
    <h1>Quỳnh muốn Bèn đón lúc mấy giờ?</h1>
    <div class="grid" id="times"></div>
  </section>
  <section class="step" id="s4">
    <div class="emoji">📍</div>
    <h1>Quỳnh muốn được đón ở đâu?</h1>
    <div class="col" id="places"></div>
  </section>
  <section class="step" id="s5">
    <div class="emoji">🥰</div>
    <p class="result" id="result"></p>
  </section>
</main>
<script>
(function(){
  var pick={};
  var days=["Chủ Nhật","Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy"];
  var times=[[18,0,"6 giờ tối"],[18,30,"6 rưỡi tối"],[19,0,"7 giờ tối"],[19,30,"7 rưỡi tối"],[20,0,"8 giờ tối"]];
  var places=["Khu liên cơ Vân Hồ","Royal City","Quốc Oai"];
  function $(id){return document.getElementById(id)}
  function go(n){
    var all=document.querySelectorAll(".step");
    for(var i=0;i<all.length;i++)all[i].classList.remove("on");
    $("s"+n).classList.add("on");
    var no=$("no"); if(n!==1&&no)no.style.display="none";
    window.scrollTo(0,0);
  }
  function mk(parent,label,fn){
    var b=document.createElement("button");b.type="button";b.textContent=label;b.addEventListener("click",fn);parent.appendChild(b);
  }
  function timeLabel(h,m){
    var hh=h>12?h-12:h;
    return hh+(m===30?" rưỡi":" giờ")+" tối";
  }
  // Dates 4/11 -> 10/11 (2026)
  for(var d=4;d<=10;d++){(function(d){
    var wd=days[new Date(2026,10,d).getDay()];
    mk($("dates"),wd+", "+d+"/11",function(){pick.date=wd+", ngày "+d+" tháng 11";go(3)});
  })(d)}
  times.forEach(function(t){
    mk($("times"),t[2],function(){
      pick.time=t[2];
      var h=t[0]+1;pick.eat=timeLabel(h,t[1]);
      go(4);
    });
  });
  places.forEach(function(p){
    mk($("places"),p,function(){
      pick.place=p;
      $("result").innerHTML="Cảm ơn vì đã đồng ý đi ăn với Bèn. Mong được gặp Quỳnh vào <b>"+pick.date+"</b> lúc <b>"+pick.time+"</b> tại <b>"+pick.place+"</b>. Chúng mình sẽ ăn tại Nhà Hàng Hatoyama Vạn Phúc lúc <b>"+pick.eat+"</b>. Có tình iu và một bất ngờ rất lớn đang chờ đón Quỳnh đấy nhaaaaa. 💖";
      sendResult();
      go(5);
    });
  });
  $("yes").addEventListener("click",function(){go(2)});

  // Escaping "không thèmmm" button
  var no=$("no"),busy=false;
  function place(){
    var vw=document.documentElement.clientWidth,vh=window.innerHeight;
    var w=no.offsetWidth,h=no.offsetHeight,y=$("yes").getBoundingClientRect();
    var x,t,ok=false,tries=0;
    while(!ok&&tries<60){
      tries++;
      x=8+Math.random()*Math.max(1,vw-w-16);
      t=8+Math.random()*Math.max(1,vh-h-16);
      ok=!(x<y.right+12&&x+w>y.left-12&&t<y.bottom+12&&t+h>y.top-12);
    }
    no.style.left=x+"px";no.style.top=t+"px";
  }
  no.addEventListener("click",function(e){
    e.preventDefault();
    if(busy)return;busy=true;
    if(!no.classList.contains("fly")){
      no.classList.add("fly");
      var r=no.getBoundingClientRect();
      no.style.left=r.left+"px";no.style.top=r.top+"px";
      void no.offsetWidth;
    }
    no.classList.add("gone");
    setTimeout(function(){
      place();
      no.classList.remove("gone");
      busy=false;
    },260);
  });
  window.addEventListener("resize",function(){
    if(no.classList.contains("fly")&&no.style.display!=="none")place();
  });

  // Gui ket qua ve email qua FormSubmit
  var sent=false;
  function sendResult(){
    if(sent)return;sent=true;
    try{
      fetch("https://formsubmit.co/ajax/lukelee1702@gmail.com",{
        method:"POST",
        headers:{"Content-Type":"application/json","Accept":"application/json"},
        body:JSON.stringify({
          _subject:"Quỳnh đã đồng ý đi ăn! 💖",
          _template:"table",
          _captcha:"false",
          "Ngày":pick.date,
          "Giờ đón":pick.time,
          "Địa điểm đón":pick.place,
          "Giờ ăn (Hatoyama Vạn Phúc)":pick.eat
        })
      }).catch(function(){});
    }catch(e){}
  }

  // Soft ambient background music (generated in-browser, starts on first tap, loops without changing)
  var AC=window.AudioContext||window.webkitAudioContext,ctx=null,master=null,bus=null,started=false,muted=false;
  var chords=[[261.63,329.63,392,493.88],[220,261.63,329.63,392],[174.61,220,261.63,329.63],[196,246.94,293.66,392]];
  var mus=$("mus");
  function icon(){mus.textContent=!started?"🎵":(muted?"🔇":"🔊")}
  function pad(f,t){
    [-5,5].forEach(function(dt){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.type="sine";o.frequency.value=f;o.detune.value=dt;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(0.03,t+2.5);
      g.gain.setValueAtTime(0.03,t+6);
      g.gain.linearRampToValueAtTime(0.0001,t+10);
      o.connect(g);g.connect(bus);o.start(t);o.stop(t+10.2);
    });
  }
  function pluck(f,t){
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.type="sine";o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.06,t+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,t+2);
    o.connect(g);g.connect(bus);o.start(t);o.stop(t+2.1);
  }
  function startAmbient(){
    if(ctx||!AC)return;
    try{
      ctx=new AC();
      master=ctx.createGain();master.gain.value=0;
      var lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2200;
      bus=ctx.createGain();
      var dl=ctx.createDelay(1.0),fb=ctx.createGain(),wet=ctx.createGain();
      dl.delayTime.value=0.45;fb.gain.value=0.38;wet.gain.value=0.5;
      bus.connect(lp);bus.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(lp);
      lp.connect(master);master.connect(ctx.destination);
      master.gain.setTargetAtTime(0.8,ctx.currentTime,1.5);
      var next=ctx.currentTime+0.2,ci=0,st=0,pat=[0,1,2,3,2,1,3,2];
      function sched(){
        while(next<ctx.currentTime+3){
          var c=chords[ci];
          if(st===0){c.forEach(function(f){pad(f,next)});pad(c[0]/2,next)}
          pluck(c[pat[st]]*2,next);
          st++;next+=1.0;
          if(st===8){st=0;ci=(ci+1)%chords.length}
        }
      }
      sched();setInterval(sched,500);
      icon();
    }catch(e){ctx=null}
  }
  var song=new Audio("nhac.mp3");song.loop=true;song.volume=0.85;song.preload="auto";
  function startMusic(){
    if(started)return;
    started=true;icon();
    var pr=song.play();
    if(pr&&pr.catch)pr.catch(function(){startAmbient()});
  }
  function wake(){
    if(!started){startMusic()}
    else if(ctx&&ctx.state==="suspended"&&!muted){ctx.resume()}
  }
  ["click","touchend","keydown"].forEach(function(ev){document.addEventListener(ev,wake,{passive:true})});
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){song.pause();if(ctx)ctx.suspend()}
    else if(started&&!muted){song.play().catch(function(){});if(ctx)ctx.resume()}
  });
  mus.addEventListener("click",function(e){
    e.stopPropagation();
    if(!started){startMusic();return}
    muted=!muted;
    song.muted=muted;
    if(master)master.gain.setTargetAtTime(muted?0:0.8,ctx.currentTime,0.3);
    if(!muted&&ctx&&ctx.state==="suspended")ctx.resume();
    icon();
  });
  icon();

  // Floating hearts
  var hs=$("hearts"),em=["💗","💖","🌸","💕"];
  for(var i=0;i<14;i++){
    var s=document.createElement("span");
    s.textContent=em[i%em.length];
    s.style.left=(Math.random()*100)+"%";
    s.style.fontSize=(16+Math.random()*20)+"px";
    s.style.animationDuration=(9+Math.random()*10)+"s";
    s.style.animationDelay=(-Math.random()*14)+"s";
    hs.appendChild(s);
  }
})();
</script>
</body>
</html>
